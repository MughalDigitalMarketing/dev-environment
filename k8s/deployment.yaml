apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-environment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dev-environment
  template:
    metadata:
      labels:
        app: dev-environment
    spec:
      containers:
        - name: app
          image: ghcr.io/MughalDigitalMarketing/dev-environment:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: dev-env-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
