version: "3.9"

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"

  app:
    build: .
    command: pnpm dev
    volumes:
      - ./:/usr/src/app:cached
      - /usr/src/app/node_modules
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/appdb?schema=public
      REDIS_URL: redis://redis:6379
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      - db
      - redis

volumes:
  pgdata:
