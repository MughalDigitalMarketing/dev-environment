name: Build and Publish (production)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ github.sha }}
          file: ./Dockerfile.prod
          platforms: linux/amd64,linux/arm64

  deploy-to-k8s:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: secrets.KUBE_CONFIG != ''
    steps:
      - uses: actions/checkout@v4
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: '1.27.0'
      - name: Configure kubeconfig
        run: echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > kubeconfig && export KUBECONFIG=$PWD/kubeconfig
      - name: Set image
        run: kubectl set image deployment/dev-environment app=ghcr.io/${{ github.repository }}:${{ github.sha }} --record
      - name: Rollout status
        run: kubectl rollout status deployment/dev-environment

